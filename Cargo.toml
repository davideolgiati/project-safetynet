[package]
name = "project-safetynet"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
flate2 = "1.1.9"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo_used = "warn"
dbg_macro = "warn"
unsafe_code = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
